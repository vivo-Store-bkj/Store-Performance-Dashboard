name: Convert Excel to Dashboard Data

on:
  push:
    paths:
      - "source/dashboard_data.xlsx"
      - "source/stock_data.xlsx"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Convert Performance Excel to data/*.json
        env:
          UPDATED_BY: "Michael Fumar"
        run: python scripts/convert_xlsx_to_json.py

      - name: Convert Stock Excel to data/stock-*.json
        env:
          UPDATED_BY: "Michael Fumar"
        run: python scripts/convert_stock_xlsx_to_json.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Auto-update dashboard data"
          git push
